<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat App - Group & Private</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 10px; }
    #chat, #privateChat {
      border: 1px solid #ccc;
      padding: 10px;
      height: 250px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #fafafa;
    }
    input, button { padding: 8px; margin: 5px 0; }
    .message { margin: 5px 0; }
    .system { font-style: italic; color: gray; }
    .private { color: darkred; font-style: italic; }
  </style>
</head>
<body>
  <h2>Welcome to Chat App</h2>

  <div>
    <strong>Your username:</strong> <span id="usernameDisplay"></span>
  </div>

  <h3>Group Chat (Room: <span id="roomIdDisplay"></span>)</h3>
  <div id="chat"></div>
  <input type="text" id="groupMessage" placeholder="Type group message..." style="width: 80%;" />
  <button onclick="sendGroupMessage()">Send Group</button>
  <button onclick="leaveRoom()">Leave Room</button>

  <h3>Private Chat</h3>
  <input type="text" id="privateRecipient" placeholder="Recipient username" style="width: 40%;" />
  <input type="text" id="privateMessage" placeholder="Type private message..." style="width: 35%;" />
  <button onclick="sendPrivateMessage()">Send Private</button>
  <div id="privateChat"></div>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
  <script>
    let username = prompt("Enter your username:");
    if (!username) {
      alert("Username is required!");
      throw new Error("Username required");
    }
    document.getElementById("usernameDisplay").textContent = username;

    const roomId = "general"; // Your room id
    document.getElementById("roomIdDisplay").textContent = roomId;

    const socket = new SockJS(`http://localhost:8080/ws?username=${username}`);
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
      console.log("Connected: " + frame);

      // Subscribe to group room topic
      stompClient.subscribe(`/topic/room/${roomId}`, function (message) {
        const msg = JSON.parse(message.body);
        showGroupMessage(msg);
      });

      // Subscribe to user private queue
      stompClient.subscribe("/user/queue/messages", function (message) {
        const msg = JSON.parse(message.body);
        showPrivateMessage(msg);
      });

      // Members list or errors (optional)
      stompClient.subscribe("/user/queue/members", function (message) {
        console.log("Members list:", message.body);
      });
      stompClient.subscribe("/user/queue/errors", function (message) {
        alert("Error: " + message.body);
      });

      // Notify backend you joined the room
      stompClient.send(`/app/chat.join/${roomId}`, {}, {});
    });

    // Display group chat messages
    function showGroupMessage(msg) {
      const chat = document.getElementById("chat");
      let p = document.createElement("p");
      p.className = "message";

      if (msg.type === "JOIN" || msg.type === "LEAVE") {
        p.className += " system";
        p.textContent = msg.content;
      } else {
        p.innerHTML = `<b>${msg.sender}</b>: ${msg.content}`;
      }

      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }

    // Display private chat messages
    function showPrivateMessage(msg) {
      const privateChat = document.getElementById("privateChat");
      let p = document.createElement("p");
      p.className = "message private";
      p.innerHTML = `<b>${msg.sender}</b> (private): ${msg.content}`;
      privateChat.appendChild(p);
      privateChat.scrollTop = privateChat.scrollHeight;
    }

    // Send group message
    function sendGroupMessage() {
      const input = document.getElementById("groupMessage");
      if (input.value.trim() === "") return;

      stompClient.send(`/app/chat.send/${roomId}`, {}, JSON.stringify({
        content: input.value
      }));

      input.value = "";
    }

    // Send private message
    function sendPrivateMessage() {
      const recipientInput = document.getElementById("privateRecipient");
      const messageInput = document.getElementById("privateMessage");
      if (recipientInput.value.trim() === "" || messageInput.value.trim() === "") return;

      stompClient.send(`/app/chat.private`, {}, JSON.stringify({
        recipient: recipientInput.value,
        content: messageInput.value
      }));

      messageInput.value = "";
    }

    // Leave room
    function leaveRoom() {
      stompClient.send(`/app/chat.leave/${roomId}`, {}, {});
      alert("You left the room.");
      // Optionally disconnect:
      // stompClient.disconnect();
    }

    // Send on Enter key for group message
    document.getElementById("groupMessage").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendGroupMessage();
      }
    });

    // Send on Enter key for private message
    document.getElementById("privateMessage").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendPrivateMessage();
      }
    });
  </script>
</body>
</html>
