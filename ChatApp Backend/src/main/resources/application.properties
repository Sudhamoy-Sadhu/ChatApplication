spring.application.name=chat

spring.datasource.url=jdbc:postgresql://localhost:5432/ChatApp
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Cors Config:
cors.allowed-origins=http://localhost:3000

#Security Config:
security.jwt.issuer=https://your-app.example
# access token lifetime
security.jwt.access-ttl=15m
# absolute session window
security.jwt.refresh-ttl=2h
security.jwt.private-key-path=file:keys/jwt-private.pem
security.jwt.public-key-path=file:keys/jwt-public.pem
security.jwt.jti-hmac-secret=dev-secret-key-1234567890

#Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
